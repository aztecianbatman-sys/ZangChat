name: ZangChat Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: publish v0.1.1')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Electron bundles
        run: npm run build

      - name: Package Windows app
        run: npm run package:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZangChat-Windows-v0.1.1
          path: release/*
          if-no-files-found: error

      - name: Publish public GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          target_commitish: main
          name: ZangChat v0.1.1
          body: |
            # ZangChat v0.1.1

            Windows desktop build of ZangChat with the ObsidianUI v1 foundation.

            ## Included

            - Windows x64 NSIS installer
            - Windows x64 portable executable
            - Production Electron renderer with no localhost dependency
            - Supabase authentication, database, RLS, and Realtime foundation

            ## Build fixes

            - Correct Electron main entry path
            - Correct preload bundle path
            - Production renderer uses Electron loadFile()
          files: release/*
          generate_release_notes: false
          draft: false
